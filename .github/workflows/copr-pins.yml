name: Copr pins still resolve

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check-pins:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned NVRs from install.sh for real
        run: |
          set -e
          eval "$(awk '/^SKWD_NVRS=\(/,/^\)/' install.sh)"
          echo "Checking pins:"; printf '  %s\n' "${SKWD_NVRS[@]}"
          dnf -y install dnf5-plugins
          dnf -y copr enable piixini/skwd-wall-v2
          dnf -y install "${SKWD_NVRS[@]}"
