# Reproducible definition of the container skwd-wall v2 runs in.
#
# install.sh fills in __BOX__ (default skwd-wall-v2-fedora, or --box NAME)
# and runs `distrobox assemble create` against the result, then does the
# copr-enable + package install itself (see install.sh — multi-line
# init_hooks in this file format do not survive distrobox's ini parser
# reliably, so don't move that logic back in here).
#
# If you're doing this by hand instead of via install.sh: replace __BOX__
# below and export SKWD_WALL_V2_BOX with the same name before running
# anything else in bin/.
[__BOX__]
image=registry.fedoraproject.org/fedora:44
pull=true
# dnf5-plugins provides the copr subcommand. It ships in the base fedora:44
# image already (verified 2026-09-10), but pinned explicitly since that's
# not a documented guarantee.
additional_packages=dnf5-plugins
